services:
  # Backend API server (Node.js + Fastify + SQLite)
  backend:
    build:
      # M6: Wurzelkontext, damit shared/ in beide Images kommt.
      context: .
      dockerfile: server/Dockerfile
    container_name: card-game-engine-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      # Persist SQLite database across container restarts
      - db-data:/app/data
      # Persist uploaded card images
      - uploads-data:/app/uploads
    environment:
      - NODE_ENV=production
      - PORT=3001
      # Set to 0/false to close /api/auth/register once your accounts exist.
      # Closed: the accounts that need access already exist.
      - CGE_ALLOW_REGISTRATION=false
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - app-network

  # Frontend (nginx serving Vite build, proxying API to backend)
  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: card-game-engine-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

  # Cloudflare-Tunnel fuer gaming.benjathi.de. Lief bis 2026-11-08 als Waise mit
  # dem Projekt-Label, aber ohne Eintrag hier -- `down --remove-orphans` im
  # CI-Deploy haette ihn entfernt. Token aus .env (nicht im Repo).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: card-game-engine-cloudflared
    restart: unless-stopped
    # host, damit der Tunnel die auf 80/3001 veroeffentlichten Ports erreicht
    network_mode: host
    command: tunnel --edge-ip-version 4 --metrics 127.0.0.1:2000 run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN:?CF_TUNNEL_TOKEN fehlt in /opt/card-game-engine/.env}

volumes:
  db-data:
    driver: local
  uploads-data:
    driver: local

networks:
  app-network:
    driver: bridge
